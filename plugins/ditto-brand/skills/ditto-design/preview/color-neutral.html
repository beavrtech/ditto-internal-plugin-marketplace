<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral scale" subtitle="Product UI grays, 50–900" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;gap:6px;}
  .c{flex:1;height:60px;border-radius:8px;border:1px solid rgba(19,14,48,.06);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;box-sizing:border-box;}
  .c b{font-size:11px;font-weight:600;letter-spacing:-0.01em;}
  .c span{font-size:9px;letter-spacing:-0.01em;opacity:.75;}
  .ttl{font-size:13px;font-weight:600;letter-spacing:-0.02em;}
</style></head><body>
<div class="wrap">
  <span class="ttl">Neutral — product UI grays (shadcn original)</span>
  <div class="row">
    <div class="c" style="background:#FAFAFA"><b>50</b><span>FAFAFA</span></div>
    <div class="c" style="background:#F5F5F5"><b>100</b><span>F5F5F5</span></div>
    <div class="c" style="background:#E5E5E5"><b>200</b><span>E5E5E5</span></div>
    <div class="c" style="background:#D4D4D4"><b>300</b><span>D4D4D4</span></div>
    <div class="c" style="background:#A3A3A3;color:#fff"><b>400</b><span>A3A3A3</span></div>
    <div class="c" style="background:#737373;color:#fff"><b>500</b><span>737373</span></div>
    <div class="c" style="background:#525252;color:#fff"><b>600</b><span>525252</span></div>
    <div class="c" style="background:#404040;color:#fff"><b>700</b><span>404040</span></div>
    <div class="c" style="background:#262626;color:#fff"><b>800</b><span>262626</span></div>
    <div class="c" style="background:#171717;color:#fff"><b>900</b><span>171717</span></div>
  </div>
</div>
</body></html>
