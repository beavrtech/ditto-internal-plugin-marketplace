<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Warm-tinted shadow ramp" viewport="700x160" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--tan-200);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:30px 24px;display:flex;gap:24px;align-items:center;justify-content:center;}
  .sw{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .box{width:96px;height:64px;background:var(--white);border-radius:14px;}
  .n{font-size:12px;font-weight:600;}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-xs);"></div><span class="n">xs</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-sm);"></div><span class="n">sm</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-md);"></div><span class="n">md</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-lg);"></div><span class="n">lg</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-xl);"></div><span class="n">xl</span></div>
</div>
</body></html>
