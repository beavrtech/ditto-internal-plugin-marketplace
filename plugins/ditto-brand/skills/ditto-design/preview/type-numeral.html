<!DOCTYPE html>
<!-- @dsCard group="Type" name="Numerals" subtitle="Hedvig serif oversized stat figures" viewport="700x170" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:24px 32px;display:flex;align-items:center;gap:36px;}
  .num{font-family:var(--font-serif);font-size:96px;line-height:1;letter-spacing:-0.01em;}
  .lab{display:flex;flex-direction:column;gap:6px;}
  .lab b{font-size:15px;letter-spacing:-0.02em;}
  .lab span{font-size:12px;color:var(--fg-3);letter-spacing:-0.01em;}
</style></head><body>
<div class="wrap">
  <span class="num">4×</span>
  <span class="num" style="color:var(--navy);">49.6%</span>
  <div class="lab">
    <b>Numeral · Hedvig Serif 88</b>
    <span>Oversized stat figures — 105% line-height, tracking −1%.</span>
    <span>Used for big metrics in hero & cards.</span>
  </div>
</div>
</body></html>
