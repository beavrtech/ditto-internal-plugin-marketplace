<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Tan scale" subtitle="Signature warm neutral, 50–600" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;gap:6px;}
  .c{flex:1;height:60px;border-radius:8px;border:1px solid rgba(19,14,48,.06);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;box-sizing:border-box;}
  .c b{font-size:11px;font-weight:600;letter-spacing:-0.01em;}
  .c span{font-size:9px;letter-spacing:-0.01em;opacity:.75;}
  .ttl{font-size:13px;font-weight:600;letter-spacing:-0.02em;}
  .base{outline:2px solid var(--navy);outline-offset:1px;}
</style></head><body>
<div class="wrap">
  <span class="ttl">Tan — signature warm neutral (50–900)</span>
  <div class="row">
    <div class="c" style="background:#FDFEFC"><b>50</b><span>FDFEFC</span></div>
    <div class="c" style="background:#FCFCFA"><b>100</b><span>FCFCFA</span></div>
    <div class="c" style="background:#F9FAF5"><b>200</b><span>F9FAF5</span></div>
    <div class="c" style="background:#F5F7EF"><b>300</b><span>F5F7EF</span></div>
    <div class="c" style="background:#F2F5EA"><b>400</b><span>F2F5EA</span></div>
    <div class="c base" style="background:#EFF2E5"><b>500</b><span>EFF2E5</span></div>
    <div class="c" style="background:#E9EBD9"><b>600</b><span>E9EBD9</span></div>
    <div class="c" style="background:#D9DDBC"><b>700</b><span>D9DDBC</span></div>
    <div class="c" style="background:#C2C79E"><b>800</b><span>C2C79E</span></div>
    <div class="c" style="background:#B4B98E"><b>900</b><span>B4B98E</span></div>
  </div>
</div>
</body></html>
