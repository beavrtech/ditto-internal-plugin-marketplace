<!DOCTYPE html>
<!-- @dsCard group="Components" name="Mega-menu items" subtitle="Cream popover, Lucide icons" viewport="700x230" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;background:var(--tan);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:24px;display:flex;justify-content:center;}
  .menu{width:340px;background:var(--bg-surface-cream);border-radius:24px;box-shadow:var(--shadow-lg);padding:12px;}
  .item{display:flex;gap:12px;padding:12px 14px;border-radius:14px;align-items:center;cursor:pointer;}
  .item:hover{background:var(--tan-200);}
  .ic{width:40px;height:40px;border-radius:10px;background:var(--tan-500);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ic svg{width:20px;height:20px;color:var(--navy);}
  .t{font-size:15px;font-weight:600;letter-spacing:-0.02em;}
  .d{font-size:12px;color:var(--fg-2);letter-spacing:-0.01em;line-height:1.3;}
</style></head><body>
<div class="wrap">
  <div class="menu">
    <div class="item"><div class="ic"><i data-lucide="sparkles"></i></div><div><div class="t">Your AI-powered CSR co-pilot</div><div class="d">Answer questionnaires in a flash</div></div></div>
    <div class="item"><div class="ic"><i data-lucide="file-text"></i></div><div><div class="t">Respond to compliance requests</div><div class="d">RFPs and assessments, automated</div></div></div>
    <div class="item"><div class="ic"><i data-lucide="scale"></i></div><div><div class="t">Engage your supply chain</div><div class="d">Bring partners into sustainability</div></div></div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
