<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success · Warning · Danger · Info · AI" viewport="700x230" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;}
  .row{display:flex;align-items:center;gap:12px;}
  .chip{width:40px;height:40px;border-radius:9px;border:1px solid rgba(19,14,48,.08);flex-shrink:0;}
  .meta{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .n{font-size:14px;font-weight:600;letter-spacing:-0.02em;}
  .t{font-size:11px;color:var(--fg-3);letter-spacing:-0.01em;}
  .t b{font-weight:600;color:var(--fg-2);}
</style></head><body>
<div class="wrap">
  <div class="row"><div class="chip" style="background:#25C329"></div><div class="meta"><span class="n">Success</span><span class="t"><b>green-500</b> · #25C329</span></div></div>
  <div class="row"><div class="chip" style="background:#EC7839"></div><div class="meta"><span class="n">Warning</span><span class="t"><b>orange-500</b> · #EC7839</span></div></div>
  <div class="row"><div class="chip" style="background:#EF4444"></div><div class="meta"><span class="n">Danger</span><span class="t"><b>red-500</b> · #EF4444</span></div></div>
  <div class="row"><div class="chip" style="background:#3A93FF"></div><div class="meta"><span class="n">Info</span><span class="t"><b>blue-500</b> · #3A93FF</span></div></div>
  <div class="row"><div class="chip" style="background:#FFE228"></div><div class="meta"><span class="n">Accent</span><span class="t"><b>yellow-400</b> · #FFE228</span></div></div>
  <div class="row"><div class="chip" style="background:#130E30"></div><div class="meta"><span class="n">Primary</span><span class="t"><b>navy-900</b> · #130E30</span></div></div>
  <div class="row"><div class="chip" style="background:#EFF2E5"></div><div class="meta"><span class="n">Canvas</span><span class="t"><b>tan-500</b> · #EFF2E5</span></div></div>
  <div class="row"><div class="chip" style="background:#171717"></div><div class="meta"><span class="n">Foreground</span><span class="t"><b>neutral-900</b> · #171717</span></div></div>
</div>
</body></html>
