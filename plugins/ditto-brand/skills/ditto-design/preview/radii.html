<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="5 → 30px, plus pill" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:24px;display:flex;gap:18px;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .box{width:78px;height:64px;background:var(--tan);border:1.5px solid var(--navy);}
  .n{font-size:12px;font-weight:600;}
  .h{font-size:11px;color:var(--fg-3);}
  .pill{width:96px;height:44px;border-radius:999px;background:var(--navy);}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="box" style="border-radius:5px;"></div><span class="n">xs</span><span class="h">5px</span></div>
  <div class="sw"><div class="box" style="border-radius:8px;"></div><span class="n">sm</span><span class="h">8px</span></div>
  <div class="sw"><div class="box" style="border-radius:12px;"></div><span class="n">md</span><span class="h">12px</span></div>
  <div class="sw"><div class="box" style="border-radius:16px;"></div><span class="n">lg</span><span class="h">16px</span></div>
  <div class="sw"><div class="box" style="border-radius:24px;"></div><span class="n">xl</span><span class="h">24px</span></div>
  <div class="sw"><div class="box" style="border-radius:30px;"></div><span class="n">2xl</span><span class="h">30px</span></div>
  <div class="sw"><div class="pill"></div><span class="n">pill</span><span class="h">999px</span></div>
</div>
</body></html>
