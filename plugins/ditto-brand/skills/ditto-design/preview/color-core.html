<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Core brand colors" subtitle="Navy · Yellow · Tan · Green · Blue · Magenta" viewport="700x290" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{height:80px;border-radius:12px;border:1px solid rgba(19,14,48,.08);}
  .n{font-size:13px;font-weight:600;letter-spacing:-0.02em;}
  .h{font-size:12px;color:var(--fg-3);}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:var(--navy);"></div><span class="n">Navy</span><span class="h">#130E30</span></div>
  <div class="sw"><div class="chip" style="background:var(--yellow);"></div><span class="n">Yellow</span><span class="h">#FFE228</span></div>
  <div class="sw"><div class="chip" style="background:var(--tan);"></div><span class="n">Tan</span><span class="h">#EFF2E5</span></div>
  <div class="sw"><div class="chip" style="background:#59E25D;"></div><span class="n">Green</span><span class="h">#59E25D</span></div>
  <div class="sw"><div class="chip" style="background:#3A93FF;"></div><span class="n">Blue</span><span class="h">#3A93FF</span></div>
  <div class="sw"><div class="chip" style="background:#E261E5;"></div><span class="n">Magenta</span><span class="h">#E261E5</span></div>
</div>
</body></html>
