<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base unit" viewport="700x250" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--white);font-family:var(--font-sans);color:var(--fg-1);}
  .wrap{padding:26px 24px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:14px;}
  .bar{height:18px;background:var(--yellow);border-radius:3px;}
  .n{font-size:12px;font-weight:600;width:34px;}
  .h{font-size:11px;color:var(--fg-3);}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="n">1</span><div class="bar" style="width:4px;"></div><span class="h">4px</span></div>
  <div class="row"><span class="n">2</span><div class="bar" style="width:8px;"></div><span class="h">8px</span></div>
  <div class="row"><span class="n">3</span><div class="bar" style="width:12px;"></div><span class="h">12px</span></div>
  <div class="row"><span class="n">4</span><div class="bar" style="width:16px;"></div><span class="h">16px</span></div>
  <div class="row"><span class="n">5</span><div class="bar" style="width:24px;"></div><span class="h">24px</span></div>
  <div class="row"><span class="n">6</span><div class="bar" style="width:32px;"></div><span class="h">32px</span></div>
  <div class="row"><span class="n">7</span><div class="bar" style="width:48px;"></div><span class="h">48px · section gutters</span></div>
  <div class="row"><span class="n">9</span><div class="bar" style="width:80px;"></div><span class="h">80px · section rhythm</span></div>
</div>
</body></html>
